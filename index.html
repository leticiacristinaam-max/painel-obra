<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard Engebio</title>
<style>
:root{color-scheme:light;--b900:#00302c;--b700:#0b5f5a;--b500:#138a83;--b200:#a8d8d2;--b50:#eef7f5;--ink:#0d2624;--ink2:#4b5f5d;--critical:#d03b3b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a2a27;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
#login{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow:hidden}
#login .bg{position:absolute;inset:-5%;background:url("foto_obra.jpg") center/cover;filter:blur(3px) saturate(1.1);transform:scale(1.05);animation:kb 30s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.15) translate(-2%,-1%)}}
#login::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,40,37,.88),rgba(0,48,44,.55));z-index:1}
.box{position:relative;z-index:2;width:100%;max-width:380px;background:rgba(255,255,255,.96);border-radius:20px;padding:28px 26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:up .6s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.box img{height:52px;display:block;margin:0 auto 14px}
.box h1{font-size:17px;text-align:center;margin:0 0 4px;color:var(--b900)}
.box p{font-size:13px;text-align:center;color:var(--ink2);margin:0 0 18px}
label{font-size:12.5px;color:var(--ink2);display:block;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:11px 14px;border:1px solid #c4d3d0;border-radius:12px;outline:none;transition:border-color .2s,box-shadow .2s}
input[type=password]:focus{border-color:var(--b500);box-shadow:0 0 0 3px rgba(19,138,131,.18)}
.lem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:12px 0 16px}
button{width:100%;font:inherit;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--b700),var(--b500));border:0;border-radius:12px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--critical);font-size:13px;text-align:center;min-height:18px;margin-top:10px}
.foot{font-size:11.5px;color:#7f908e;text-align:center;margin-top:14px}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#f1f6f5}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="login">
  <div class="bg"></div>
  <form class="box" id="form" autocomplete="on">
    <img src="logo_engebio.png" alt="Engebio – Engenharia do Meio Ambiente">
    <h1>Painel do cronograma</h1>
    <p>Dashboard do cronograma · acesso restrito</p>
    <input type="text" name="username" value="dashboard" autocomplete="username" hidden>
    <label for="pw">Senha</label>
    <input type="password" id="pw" autocomplete="current-password" required autofocus>
    <label class="lem"><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
    <button id="btn" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
    <div class="foot">Os dados ficam criptografados e só abrem com a senha.</div>
  </form>
</div>
<iframe id="app" title="Dashboard"></iframe>
<script>
(function(){
var SAL=Uint8Array.from(atob("9YqV1KcCxq27URg7f78nXQ=="),function(c){return c.charCodeAt(0)}), ITER=200000;
var KEYNAME='dash_chave_'+"9YqV1KcCxq27URg7f78nXQ==".slice(0,8);
var te=new TextEncoder(), td=new TextDecoder(), ke=null, km=null, ultimo='';
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function hex(u){return Array.prototype.map.call(u,function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
async function chaves(raw){
  ke=await crypto.subtle.importKey('raw',raw.slice(0,32),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  km=await crypto.subtle.importKey('raw',raw.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['sign']);
}
async function derivar(pw){
  var base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:SAL,iterations:ITER,hash:'SHA-256'},base,512));
}
async function decifra(txt){
  var o=JSON.parse(txt), n=b64(o.n), c=b64(o.c), t=b64(o.t);
  var m=new Uint8Array(n.length+c.length); m.set(n); m.set(c,n.length);
  var tag=new Uint8Array(await crypto.subtle.sign('HMAC',km,m));
  if(hex(tag)!==hex(t)) throw new Error('senha');
  var blocos=Math.ceil(c.length/32), ps=[];
  for(var i=0;i<blocos;i++){ var b=new Uint8Array(20); b.set(n); new DataView(b.buffer).setUint32(16,i); ps.push(crypto.subtle.sign('HMAC',ke,b)); }
  var ks=await Promise.all(ps), out=new Uint8Array(c.length);
  for(var j=0;j<c.length;j++){ out[j]=c[j]^new Uint8Array(ks[j>>5])[j&31]; }
  return td.decode(out);
}
async function baixa(nome){ var r=await fetch(nome+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('rede'); return r.text(); }
async function abrir(){
  var app=await decifra(await baixa('app.enc')), dtxt=await baixa('dados.enc'), dados=await decifra(dtxt);
  ultimo=dtxt;
  var html=app.replace('<!--DADOS-->','<script>window.__DASH='+dados.replace(/<\//g,'<\\/')+';<\/script>');
  var f=document.getElementById('app'); f.srcdoc=html; f.style.display='block';
  document.getElementById('login').style.display='none';
  setInterval(async function(){
    try{ var t=await baixa('dados.enc'); if(t!==ultimo){ ultimo=t; var D=JSON.parse(await decifra(t)); f.contentWindow.postMessage({tipo:'dash',D:D},'*'); } }catch(e){}
  },30000);
}
var form=document.getElementById('form'), err=document.getElementById('err'), btn=document.getElementById('btn');
form.addEventListener('submit',async function(e){
  e.preventDefault(); err.textContent=''; btn.disabled=true; btn.textContent='Abrindo…';
  try{
    var raw=await derivar(document.getElementById('pw').value); await chaves(raw); await abrir();
    if(document.getElementById('lembrar').checked){ try{localStorage.setItem(KEYNAME,btoa(String.fromCharCode.apply(null,raw)))}catch(x){} }
  }catch(x){
    err.textContent=(x.message==='senha')?'Senha incorreta.':'Não consegui abrir. Verifique a internet e tente de novo.';
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    btn.disabled=false; btn.textContent='Entrar';
  }
});
// entra direto se o aparelho lembrou
(async function(){
  var s=null; try{s=localStorage.getItem(KEYNAME)}catch(x){}
  if(!s) return;
  try{ await chaves(b64(s)); await abrir(); }catch(x){ try{localStorage.removeItem(KEYNAME)}catch(y){} }
})();
})();
</script>
</body>
</html>
